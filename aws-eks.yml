---
version: 1
name: csb-aws-eks
id: 8b5df36c-0bf1-4a58-9fb8-2df72f6eec9a
description: |
  Managed Amazon EKS cluster with three private worker nodes. Binding returns
  connection metadata and an AWS CLI exec-credential recipe only; it creates no
  Kubernetes namespace, RBAC grant, static credential, token, key, or kubeconfig.
display_name: CSB AWS EKS
image_url: file://service-images/csb.png
documentation_url: https://docs.aws.amazon.com/eks/latest/userguide/
provider_display_name: AWS
support_url: https://aws.amazon.com/eks/
tags: [aws, eks, kubernetes, sandbox]
plan_updateable: false
plans:
- name: sandbox-3-node
  id: 13859160-e70e-4bda-b3dc-42c40f56c51a
  description: |
    Eight-hour sandbox metadata envelope with a managed control plane and one
    managed node group fixed at three private nodes.
  display_name: Sandbox 3-node
  properties:
    ttl_hours: 8
    node_count: 3
    kubernetes_version: "1.34"
    instance_type: m6i.large
provision:
  plan_inputs:
  - field_name: ttl_hours
    type: number
    details: Hours until the external sandbox TTL controller should deprovision this instance.
    default: 8
    constraints:
      minimum: 8
      maximum: 8
  - field_name: node_count
    type: integer
    details: Fixed managed node group minimum, desired, and maximum size.
    default: 3
    constraints:
      minimum: 3
      maximum: 3
  - field_name: kubernetes_version
    type: string
    details: EKS Kubernetes minor version selected by the broker operator through plan configuration.
    default: "1.34"
    constraints:
      pattern: ^1\.[0-9]+$
  - field_name: instance_type
    type: string
    details: Non-burstable managed node instance type. The default provides approximately 2 vCPU and 8 GiB memory.
    default: m6i.large
  user_inputs:
  - field_name: region
    type: string
    details: AWS region for the EKS cluster.
    default: us-east-1
    constraints:
      examples:
      - us-east-1
      - us-west-2
      pattern: ^[a-z][a-z0-9-]+$
    prohibit_update: true
  - field_name: public_access_cidrs_json
    type: string
    details: |
      JSON array of IPv4 or IPv6 CIDRs allowed to reach the public Kubernetes API
      endpoint. The documentation-only default denies ordinary public clients;
      operators must replace it with approved administrative egress CIDRs.
    default: '["192.0.2.0/32"]'
    prohibit_update: true
  computed_inputs:
  - name: instance_name
    default: csb-eks-${request.instance_id}
    overwrite: true
    type: string
  - name: labels
    default: ${json.marshal(request.default_labels)}
    overwrite: true
    type: object
  template_refs:
    data: terraform/eks/provision/data.tf
    main: terraform/eks/provision/main.tf
    outputs: terraform/eks/provision/outputs.tf
    provider: terraform/eks/provision/provider.tf
    versions: terraform/eks/provision/versions.tf
    variables: terraform/eks/provision/variables.tf
  outputs:
  - field_name: cluster_name
    type: string
    details: EKS cluster name.
  - field_name: endpoint
    type: string
    details: Kubernetes API endpoint.
  - field_name: certificate_authority_data
    type: string
    details: Base64-encoded public cluster certificate authority data.
  - field_name: region
    type: string
    details: AWS region containing the cluster.
  - field_name: kubernetes_version
    type: string
    details: EKS Kubernetes minor version.
  - field_name: node_group_name
    type: string
    details: Managed node group name.
  - field_name: node_count
    type: integer
    details: Fixed managed node count.
  - field_name: instance_type
    type: string
    details: Managed node EC2 instance type.
  - field_name: vpc_id
    type: string
    details: VPC containing the cluster and worker nodes.
  - field_name: private_subnet_ids_json
    type: string
    details: JSON array of private worker subnet IDs.
  - field_name: public_access_cidrs_json
    type: string
    details: JSON array of CIDRs allowed to reach the public API endpoint.
  - field_name: ttl_expires_at
    type: string
    details: RFC3339 metadata timestamp for external TTL enforcement.
  - field_name: normalized_instance_json
    type: string
    details: Normalized v1 EKS instance metadata for cross-provider consumers.
bind:
  plan_inputs: []
  user_inputs: []
  computed_inputs:
  - name: cluster_name
    default: ${instance.details["cluster_name"]}
    overwrite: true
    type: string
  - name: endpoint
    default: ${instance.details["endpoint"]}
    overwrite: true
    type: string
  - name: certificate_authority_data
    default: ${instance.details["certificate_authority_data"]}
    overwrite: true
    type: string
  - name: region
    default: ${instance.details["region"]}
    overwrite: true
    type: string
  - name: kubernetes_version
    default: ${instance.details["kubernetes_version"]}
    overwrite: true
    type: string
  - name: ttl_expires_at
    default: ${instance.details["ttl_expires_at"]}
    overwrite: true
    type: string
  template_refs:
    main: terraform/eks/bind/main.tf
    outputs: terraform/eks/bind/outputs.tf
    provider: terraform/eks/bind/provider.tf
    versions: terraform/eks/bind/versions.tf
    variables: terraform/eks/bind/variables.tf
  outputs:
  - field_name: cluster_name
    type: string
    details: EKS cluster name.
  - field_name: endpoint
    type: string
    details: Kubernetes API endpoint.
  - field_name: certificate_authority_data
    type: string
    details: Base64-encoded public cluster certificate authority data.
  - field_name: region
    type: string
    details: AWS region containing the cluster.
  - field_name: kubernetes_version
    type: string
    details: EKS Kubernetes minor version.
  - field_name: ttl_expires_at
    type: string
    details: RFC3339 metadata timestamp for external TTL enforcement.
  - field_name: access_notice
    type: string
    details: Explicit metadata-only MVP authorization and isolation notice.
  - field_name: exec_credential_json
    type: string
    details: Kubernetes client exec-credential recipe using the caller's ambient AWS identity.
  - field_name: normalized_binding_json
    type: string
    details: Normalized v1 metadata-only EKS binding payload.
