---
version: 1
name: csb-aws-bedrock
id: a1b2c3d4-e5f6-7890-abcd-ef1234567800
description: |
  CSB AWS Bedrock AI — brokers IAM credentials for foundation model inference via
  Amazon Bedrock. Provision creates a scoped IAM policy and Bedrock guardrail; bind
  creates a per-binding IAM user + access key returned in VCAP_SERVICES. Model access
  must be enabled in the AWS console before invocation will succeed.
display_name: CSB AWS Bedrock AI
image_url: file://service-images/csb.png
documentation_url: https://docs.aws.amazon.com/bedrock/latest/userguide/
provider_display_name: GSA TTS
support_url: https://aws.amazon.com/bedrock/
tags: [aws, bedrock, ai, llm, generative-ai]
plan_updateable: true
plans:
- name: sandbox-8h
  id: d4e5f6a7-b8c9-0123-defa-123456789100
  description: |
    Sandbox plan — 8-hour TTL with configurable model selection.
    Auto-deprovisioned by TTL controller after ttl_hours. Optional operator
    budget alert email can be configured broker-side.
  display_name: Sandbox 8-hour
  properties:
    ttl_hours: 8
    region: us-east-1
    models: '["anthropic.claude-3-haiku-20240307-v1:0","amazon.titan-embed-text-v1","amazon.titan-text-lite-v1"]'
- name: standard
  id: e5f6a7b8-c9d0-1234-efab-234567890100
  description: |
    Standard plan — configurable TTL up to 8 hours and model selection.
    Optional operator budget alert email can be configured broker-side.
  display_name: Standard
  properties: {}
provision:
  plan_inputs:
  - field_name: ttl_hours
    type: number
    details: Hours until this instance is auto-deprovisioned (max 8 for sandbox-8h plan).
    default: 8
  - field_name: models
    type: string
    details: |
      JSON array of Bedrock foundation model IDs to allow. Model access must be
      enabled in the AWS console. Example:
      '["anthropic.claude-3-haiku-20240307-v1:0","amazon.titan-embed-text-v1"]'
    default: '["anthropic.claude-3-haiku-20240307-v1:0","amazon.titan-embed-text-v1","amazon.titan-text-lite-v1"]'
  - field_name: budget_amount
    type: number
    details: Monthly USD budget threshold metadata for this instance. Alerting is operator-email based when configured broker-side.
    default: 100
  user_inputs:
  - field_name: instance_name
    type: string
    details: Name prefix for created IAM resources.
    default: csb-${request.instance_id}
    prohibit_update: true
  - field_name: region
    type: string
    details: AWS region where Bedrock is enabled.
    default: us-east-1
    constraints:
      examples:
      - us-east-1
      - us-west-2
      pattern: ^[a-z][a-z0-9-]+$
    prohibit_update: true
  computed_inputs:
  - name: labels
    default: ${json.marshal(request.default_labels)}
    overwrite: true
    type: object
  - name: budget_alert_email
    default: ${config("aws.budget_alert_email")}
    overwrite: true
    type: string
  template_refs:
    data: terraform/bedrock/provision/data.tf
    main: terraform/bedrock/provision/main.tf
    outputs: terraform/bedrock/provision/outputs.tf
    provider: terraform/bedrock/provision/provider.tf
    versions: terraform/bedrock/provision/versions.tf
    variables: terraform/bedrock/provision/variables.tf
  outputs:
  - field_name: region
    type: string
    details: AWS region for Bedrock.
  - field_name: available_models
    type: string
    details: JSON array of provisioned model IDs.
  - field_name: bedrock_endpoint
    type: string
    details: Regional Bedrock Runtime HTTPS endpoint.
  - field_name: policy_arn
    type: string
    details: ARN of the IAM policy granting Bedrock access.
  - field_name: guardrail_id
    type: string
    details: Bedrock guardrail ID for content filtering.
  - field_name: guardrail_arn
    type: string
    details: Bedrock guardrail ARN.
  - field_name: budget_amount
    type: number
    details: Monthly USD budget threshold metadata for this instance.
  - field_name: budget_enforcement_mode
    type: string
    details: Whether an optional operator budget alert email is configured broker-side.
  - field_name: ttl_expires_at
    type: string
    details: RFC3339 timestamp when this instance expires.
bind:
  plan_inputs: []
  user_inputs: []
  computed_inputs:
  - name: region
    default: ${instance.details["region"]}
    overwrite: true
    type: string
  - name: policy_arn
    default: ${instance.details["policy_arn"]}
    overwrite: true
    type: string
  - name: guardrail_id
    default: ${instance.details["guardrail_id"]}
    overwrite: true
    type: string
  - name: guardrail_arn
    default: ${instance.details["guardrail_arn"]}
    overwrite: true
    type: string
  - name: available_models
    default: ${instance.details["available_models"]}
    overwrite: true
    type: string
  - name: bedrock_endpoint
    default: ${instance.details["bedrock_endpoint"]}
    overwrite: true
    type: string
  - name: budget_amount
    default: ${instance.details["budget_amount"]}
    overwrite: true
    type: number
  - name: budget_enforcement_mode
    default: ${instance.details["budget_enforcement_mode"]}
    overwrite: true
    type: string
  - name: ttl_expires_at
    default: ${instance.details["ttl_expires_at"]}
    overwrite: true
    type: string
  - name: user_name
    default: csb-${request.binding_id}
    overwrite: true
    type: string
  template_refs:
    main: terraform/bedrock/bind/main.tf
    outputs: terraform/bedrock/bind/outputs.tf
    provider: terraform/bedrock/bind/provider.tf
    versions: terraform/bedrock/bind/versions.tf
    variables: terraform/bedrock/bind/variables.tf
  outputs:
  - field_name: access_key_id
    type: string
    details: AWS access key ID for Bedrock invocation.
  - field_name: secret_access_key
    type: string
    details: AWS secret access key for Bedrock invocation.
  - field_name: region
    type: string
    details: AWS region.
  - field_name: models
    type: string
    details: JSON array of available model IDs.
  - field_name: bedrock_endpoint
    type: string
    details: Regional Bedrock Runtime HTTPS endpoint.
  - field_name: guardrail_id
    type: string
    details: Bedrock guardrail ID for content filtering.
  - field_name: budget_amount
    type: number
    details: Monthly USD budget threshold metadata for this instance.
  - field_name: budget_enforcement_mode
    type: string
    details: Whether an optional operator budget alert email is configured broker-side.
  - field_name: ttl_expires_at
    type: string
    details: RFC3339 timestamp when this instance expires.
