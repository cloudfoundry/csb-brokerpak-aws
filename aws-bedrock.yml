---
version: 1
name: csb-aws-bedrock
id: a1b2c3d4-e5f6-7890-abcd-ef1234567800
description: |
  CSB AWS Bedrock AI — brokers IAM credentials for foundation model inference via
  Amazon Bedrock. Provision creates a scoped IAM policy and Bedrock guardrail; bind
  creates a per-binding IAM user + access key returned in VCAP_SERVICES. Model access
  must be enabled in the AWS console before invocation will succeed.
display_name: CSB AWS Bedrock AI
image_url: file://service-images/csb.png
documentation_url: https://docs.aws.amazon.com/bedrock/latest/userguide/
provider_display_name: GSA TTS
support_url: https://aws.amazon.com/bedrock/
tags: [aws, bedrock, ai, llm, generative-ai]
plan_updateable: true
plans:
- name: sandbox-8h
  id: d4e5f6a7-b8c9-0123-defa-123456789100
  description: |
    Sandbox plan — 8-hour TTL with configurable model selection.
    Supports the same `models` override surface as the standard plan; only the
    TTL envelope is sandbox-constrained.
    Auto-deprovisioned by TTL controller after ttl_hours. Optional operator
    budget alert email can be configured broker-side.
  display_name: Sandbox 8-hour
  properties:
    ttl_hours: 8
    region: us-east-1
    models: '["us.anthropic.claude-opus-4-6-v1","us.anthropic.claude-opus-4-5-20251101-v1:0","us.anthropic.claude-sonnet-4-6","us.anthropic.claude-sonnet-4-5-20250929-v1:0","anthropic.claude-haiku-4-5-20251001-v1:0","us.meta.llama4-maverick-17b-instruct-v1:0","us.meta.llama4-scout-17b-instruct-v1:0","us.meta.llama3-3-70b-instruct-v1:0","openai.gpt-oss-120b-1:0","google.gemma-3-12b-it"]'
- name: claude-opus-4-6
  id: f6a7b8c9-d0e1-2345-abcd-345678901101
