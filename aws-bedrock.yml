- name: standard
  id: e5f6a7b8-c9d0-1234-efab-234567890100
  description: |
    Standard plan — configurable TTL up to 8 hours with the requested Bedrock
    model set enabled by default.
    Optional operator budget alert email can be configured broker-side.
  display_name: Standard
  properties:
    models: '["us.anthropic.claude-opus-4-6-v1","us.anthropic.claude-opus-4-5-20251101-v1:0","us.anthropic.claude-sonnet-4-6","us.anthropic.claude-sonnet-4-5-20250929-v1:0","anthropic.claude-haiku-4-5-20251001-v1:0","us.meta.llama4-maverick-17b-instruct-v1:0","us.meta.llama4-scout-17b-instruct-v1:0","us.meta.llama3-3-70b-instruct-v1:0","openai.gpt-oss-120b-1:0","google.gemma-3-12b-it"]'
provision:
  plan_inputs:
  - field_name: ttl_hours
    type: number
    details: Hours until this instance is auto-deprovisioned (max 8 for sandbox-8h plan).
    default: 8
  - field_name: models
    type: string
    details: |
      JSON array of Bedrock foundation model IDs to allow. Model access must be
      enabled in the AWS console. Supported on both sandbox-8h and standard.
      Example:
      '["us.anthropic.claude-opus-4-6-v1","us.meta.llama4-maverick-17b-instruct-v1:0"]'
    default: '["us.anthropic.claude-opus-4-6-v1","us.anthropic.claude-opus-4-5-20251101-v1:0","us.anthropic.claude-sonnet-4-6","us.anthropic.claude-sonnet-4-5-20250929-v1:0","anthropic.claude-haiku-4-5-20251001-v1:0","us.meta.llama4-maverick-17b-instruct-v1:0","us.meta.llama4-scout-17b-instruct-v1:0","us.meta.llama3-3-70b-instruct-v1:0","openai.gpt-oss-120b-1:0","google.gemma-3-12b-it"]'
  - field_name: budget_amount
    type: number
    details: Monthly USD budget threshold metadata for this instance. Alerting is operator-email based when configured broker-side.
    default: 100
  user_inputs:
  - field_name: instance_name
    type: string
    details: Name prefix for created IAM resources.
    default: csb-${request.instance_id}
    prohibit_update: true
  - field_name: region
    type: string
    details: AWS region where Bedrock is enabled.
    default: us-east-1
    constraints:
      examples:
      - us-east-1
      - us-west-2
      pattern: ^[a-z][a-z0-9-]+$
    prohibit_update: true
  computed_inputs:
  - name: labels
    default: ${json.marshal(request.default_labels)}
    overwrite: true
    type: object
  - name: cf_context_json
    default: ${json.marshal(request.context)}
    overwrite: true
    type: string
  - name: cf_originating_identity_json
    default: ${json.marshal(request.x_broker_api_originating_identity)}
    overwrite: true
    type: string
  - name: budget_alert_email
    default: ${config("aws.budget_alert_email")}
    overwrite: true
    type: string
  template_refs:
    data: terraform/bedrock/provision/data.tf
    main: terraform/bedrock/provision/main.tf
    outputs: terraform/bedrock/provision/outputs.tf
    provider: terraform/bedrock/provision/provider.tf
    versions: terraform/bedrock/provision/versions.tf
    variables: terraform/bedrock/provision/variables.tf
  outputs:
  - field_name: instance_name
    type: string
    details: Requested instance name used as the resource naming prefix.
  - field_name: cf_provenance_json
    type: string
    details: JSON object of the Cloud Foundry org, space, and user provenance applied to resource tags.
  - field_name: resource_tags_json
    type: string
    details: JSON object of the effective AWS tags applied to the provisioned resources.
  - field_name: region
    type: string
    details: AWS region for Bedrock.
  - field_name: available_models
    type: string
    details: JSON array of provisioned model IDs.
  - field_name: bedrock_endpoint
    type: string
    details: Regional Bedrock Runtime HTTPS endpoint.
  - field_name: policy_arn
    type: string
    details: ARN of the IAM policy granting Bedrock access.
  - field_name: guardrail_id
    type: string
    details: Bedrock guardrail ID for content filtering.
  - field_name: guardrail_arn
    type: string
    details: Bedrock guardrail ARN.
  - field_name: budget_amount
    type: number
    details: Monthly USD budget threshold metadata for this instance.
  - field_name: budget_enforcement_mode
    type: string
    details: Whether an optional operator budget alert email is configured broker-side.
  - field_name: ttl_expires_at
    type: string
    details: RFC3339 timestamp when this instance expires.
bind:
  plan_inputs: []
  user_inputs: []
  computed_inputs:
  - name: region
    default: ${instance.details["region"]}
    overwrite: true
    type: string
  - name: instance_name
    default: ${instance.details["instance_name"]}
    overwrite: true
    type: string
  - name: resource_tags_json
    default: ${instance.details["resource_tags_json"]}
    overwrite: true
    type: string
  - name: cf_context_json
    default: ${json.marshal(request.context)}
    overwrite: true
    type: string
  - name: cf_originating_identity_json
    default: ${json.marshal(request.x_broker_api_originating_identity)}
    overwrite: true
    type: string
  - name: cf_app_guid
    default: ${request.app_guid}
    overwrite: true
    type: string
  - name: policy_arn
    default: ${instance.details["policy_arn"]}
    overwrite: true
    type: string
  - name: guardrail_id
    default: ${instance.details["guardrail_id"]}
    overwrite: true
    type: string
  - name: guardrail_arn
    default: ${instance.details["guardrail_arn"]}
    overwrite: true
    type: string
  - name: available_models
    default: ${instance.details["available_models"]}
    overwrite: true
    type: string
  - name: bedrock_endpoint
    default: ${instance.details["bedrock_endpoint"]}
    overwrite: true
    type: string
  - name: ttl_expires_at
    default: ${instance.details["ttl_expires_at"]}
    overwrite: true
    type: string
  - name: user_name
    default: csb-${request.binding_id}
    overwrite: true
    type: string
  template_refs:
    main: terraform/bedrock/bind/main.tf
    outputs: terraform/bedrock/bind/outputs.tf
    provider: terraform/bedrock/bind/provider.tf
    versions: terraform/bedrock/bind/versions.tf
    variables: terraform/bedrock/bind/variables.tf
  outputs:
  - field_name: access_key_id
    type: string
    details: AWS access key ID for Bedrock invocation.
  - field_name: instance_name
    type: string
    details: Requested instance name used as the resource naming prefix.
  - field_name: binding_provenance_json
    type: string
    details: JSON object of the Cloud Foundry org, space, user, and bound app provenance for this binding.
  - field_name: resource_tags_json
    type: string
    details: JSON object of the effective AWS tags applied to the provisioned resources and per-binding IAM user.
  - field_name: secret_access_key
    type: string
    details: AWS secret access key for Bedrock invocation.
  - field_name: region
    type: string
    details: AWS region.
  - field_name: models
    type: string
    details: JSON array of available model IDs.
  - field_name: bedrock_endpoint
    type: string
    details: Regional Bedrock Runtime HTTPS endpoint.
  - field_name: guardrail_id
    type: string
    details: Bedrock guardrail ID for content filtering.
  - field_name: ttl_expires_at
    type: string
    details: RFC3339 timestamp when this instance expires.
